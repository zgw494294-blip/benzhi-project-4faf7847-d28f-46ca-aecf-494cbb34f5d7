<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>古树迁移作业许可工作台</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/features.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">古</span><div><strong>古树迁移许可</strong><small>城市树木保护作业工作台</small></div></div>
    <div id="connection" class="connection">正在连接</div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <button id="new-case" class="primary">新建迁移档案</button>
      <label class="search-label" for="case-search">档案检索</label>
      <input id="case-search" type="search" placeholder="编号、树种或迁入地">
      <label class="search-label compact" for="case-status-filter">办理状态</label>
      <select id="case-status-filter">
        <option value="">全部档案</option><option value="pending">待办理</option><option value="draft">草稿</option><option value="assessed">评估完成</option><option value="correction_required">待整改</option><option value="precheck_ready">待现场核验</option><option value="approved">已批准</option>
      </select>
      <nav id="case-list" aria-label="迁移档案列表"></nav>
      <button id="load-more" class="secondary" hidden>继续加载</button>
    </aside>
    <main>
      <section id="empty-state" class="empty-state"><h1>选择或建立迁移档案</h1><p>工作台会根据档案状态开放下一项业务操作。</p></section>
      <section id="workspace" hidden>
        <div class="case-heading">
          <div><p class="eyebrow">迁移档案</p><h1 id="case-number"></h1></div>
          <div class="case-meta"><span id="case-status" class="status"></span><span id="case-version"></span></div>
        </div>
        <div class="stepper" id="stepper" aria-label="办理进度"></div>
        <div id="notice" role="status"></div>
        <div class="content-grid">
          <section class="work-panel">
            <div class="tabs" role="tablist">
              <button data-tab="overview" class="active">档案概览</button><button data-tab="assessment">评估录入</button><button data-tab="revision">方案编制</button><button data-tab="review">审查整改</button><button data-tab="precheck">现场核验</button><button data-tab="permit">许可查看</button>
            </div>
            <div id="tab-content"></div>
          </section>
          <aside class="timeline-panel"><h2>办理时间线</h2><ol id="timeline"></ol></aside>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
